<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriptly — popup prototype (THROWAWAY)</title>
<!--
  PROTOTYPE — THROWAWAY. Do not promote into production.
  Wayfinder ticket #12: the popup shows the user WHAT they are about to store /
  have stored — the captured transcript itself — like Obsidian Web Clipper shows
  the note content. Neutral (no purple / no gradient). Top bar drives the
  capture lifecycle states.
-->
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f6f6f6;
    --text: #232323;
    --muted: #6e6e6e;
    --faint: #9a9a9a;
    --line: #ececec;
    --accent: #2f2f2f;
    --accent-hover: #1f1f1f;
    --ok: #2e7d32;
    --ok-bg: #e9f4ea;
    --err: #c62828;
    --err-bg: #fdeeee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background: #e9eaec;
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 88px 16px 96px;
    font-size: 13px;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* ---- popup shell ---- */
  .popup {
    width: 360px;
    background: var(--bg);
    border-radius: 10px;
    box-shadow: 0 10px 34px rgba(0,0,0,.16);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .appbar {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
    font-size: 12.5px; font-weight: 600; color: var(--text);
  }
  .appbar .tag { margin-left: auto; font-size: 10px; font-weight: 500; color: var(--faint); }
  .popup-body { display: flex; flex-direction: column; height: 520px; }

  /* ---- filename ---- */
  .fname {
    border: none; background: transparent; padding: 10px 12px 9px;
    font-size: 14px; font-weight: 600; color: var(--text); width: 100%; outline: none;
  }
  .fname::placeholder { color: var(--faint); }
  .fname.saved { color: var(--ok); }

  /* ---- properties (collapsible) ---- */
  .props { border-top: 1px solid var(--line); }
  .props summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; font-size: 11px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; color: var(--faint);
  }
  .props summary::-webkit-details-marker { display: none; }
  .props summary .chev { transition: transform .15s; font-size: 10px; }
  .props[open] summary .chev { transform: rotate(90deg); }
  .props-grid { padding: 0 12px 9px; }
  .prop { display: flex; padding: 3px 0; font-size: 12px; }
  .prop .k { color: var(--muted); flex: 0 0 76px; }
  .prop .v { color: var(--text); word-break: break-all; }

  /* ---- content preview (the transcript) ---- */
  .content {
    flex: 1; overflow-y: auto; border-top: 1px solid var(--line);
    padding: 10px 12px 12px;
  }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--faint); margin: 2px 0 6px;
  }
  .desc {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    border-left: 2px solid var(--line); padding-left: 9px; margin: 0 0 12px;
  }
  .seg { display: flex; gap: 10px; padding: 4px 0; }
  .seg .ts {
    flex: 0 0 42px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: var(--faint); padding-top: 1px; user-select: none;
  }
  .seg .tx { font-size: 12.5px; line-height: 1.5; color: var(--text); }

  .skeleton { display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
  .skeleton .line { height: 12px; border-radius: 6px; background: var(--bg-alt); }
  .skeleton .line.w60 { width: 60%; }
  .skeleton .line.w80 { width: 80%; }
  .skeleton .line.w45 { width: 45%; }
  .capturing-note {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
    padding: 4px 0 10px;
  }
  .spinner {
    width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid var(--line); border-top-color: var(--muted);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .errcard {
    margin: 4px 0; border: 1px solid #f2c9c9; background: var(--err-bg);
    border-radius: 8px; padding: 11px 12px; font-size: 12.5px; line-height: 1.5; color: #8c1f1f;
  }
  .errcard b { display: block; margin-bottom: 3px; font-size: 13px; }

  /* ---- banners ---- */
  .banner {
    border-top: 1px solid var(--line); padding: 8px 12px; font-size: 12px;
    display: flex; align-items: center; gap: 7px;
  }
  .banner.ok { background: var(--ok-bg); color: #1e5c23; border-top-color: #cfe7d2; }
  .banner.err { background: var(--err-bg); color: #8c1f1f; border-top-color: #f2c9c9; }
  .banner .retry { margin-left: auto; color: var(--accent); font-weight: 600; text-decoration: none; }

  /* ---- footer ---- */
  .footer { border-top: 1px solid var(--line); padding: 9px 12px 11px; background: var(--bg); }
  .dest-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; position: relative; }
  .dest-row .spacer { flex: 1; }

  .tgl { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; color: var(--text); user-select: none; }
  .tgl input { display: none; }
  .tgl .track {
    width: 30px; height: 17px; border-radius: 999px; background: #dcdcdc;
    position: relative; transition: background .15s; flex: 0 0 auto;
  }
  .tgl .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .tgl input:checked + .track { background: var(--accent); }
  .tgl input:checked + .track::after { left: 15px; }
  .tgl .hint { font-size: 10.5px; color: var(--faint); }

  .folder {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 3px 9px; font-size: 12px; color: var(--text); cursor: pointer; font-family: inherit;
    max-width: 170px;
  }
  .folder:hover { background: var(--bg-alt); }
  .folder svg { flex: 0 0 auto; }
  .folder .fname-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder.empty .fname-label { color: var(--faint); }
  .folder .chev { color: var(--faint); font-size: 10px; }

  .folder-menu {
    position: absolute; top: 28px; right: 0; z-index: 10;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 22px rgba(0,0,0,.14); min-width: 190px; padding: 4px; display: none;
  }
  .folder-menu.open { display: block; }
  .folder-menu .opt {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 7px 9px; font-size: 12px; color: var(--text); cursor: pointer; border-radius: 5px; font-family: inherit;
  }
  .folder-menu .opt:hover { background: var(--bg-alt); }
  .folder-menu .opt.pick { color: var(--muted); border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }

  .signin { font-size: 12.5px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .cloud-err { font-size: 11px; color: var(--err); margin: -3px 0 7px; }

  .save {
    width: 100%; border: 0; border-radius: 7px; cursor: pointer;
    padding: 9px 12px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .save:hover:not(:disabled) { background: var(--accent-hover); }
  .save:disabled { background: #c9c9c9; cursor: not-allowed; }

  /* ---- prototype chrome (NOT part of the design) ---- */
  .bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #e5e7eb; border-radius: 999px; padding: 6px 8px;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    z-index: 50; font-size: 12px; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center;
  }
  .bar .pill {
    border: 1px solid #374151; background: transparent; color: #e5e7eb;
    border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .bar .pill.active { background: #5b5bd6; border-color: #5b5bd6; color: #fff; font-weight: 600; }
  .bar .cap { color: #9ca3af; font-size: 11px; }
  .state-dump {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: #4b5563; background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; max-width: 360px; white-space: pre-wrap; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="popup">
      <div class="appbar">Transcriptly<span class="tag">PROTOTYPE — popup</span></div>
      <div class="popup-body" id="popup"></div>
    </div>
    <aside class="state-dump" id="dump"></aside>
  </div>

  <div class="bar" id="scenarioBar"></div>

<script>
const video = {
  title: "Building Reliable Agents: Lessons from Production",
  channel: "Ship It Weekly",
  duration: "34:12",
  language: "English",
  capturedAt: "2024-08-15 14:32",
  url: "https://youtube.com/watch?v=XXXXXXXXXXX",
  file: "2024-08-15 · building-reliable-agents.md",
};
const description = "A practical walkthrough of the engineering lessons behind production agent systems — retrieval, tool design, and evaluation.";
const segments = [
  { t: 0,   text: "so you've been building agents for a while" },
  { t: 9,   text: "and you keep hitting the same walls" },
  { t: 18,  text: "today I want to walk through the lessons that actually matter" },
  { t: 31,  text: "first, most of your failures are not the model" },
  { t: 44,  text: "they are the plumbing around it" },
  { t: 57,  text: "retrieval, tool schemas, and state" },
  { t: 69,  text: "get those right and the rest follows" },
  { t: 82,  text: "second, evaluate before you optimize" },
  { t: 95,  text: "a tiny offline eval set beats intuition every time" },
  { t: 110, text: "and third, keep your prompts boring" },
  { t: 123, text: "the clever prompt is the one that breaks next week" },
];
const FOLDERS = ["Transcriptly", "YouTube clips", "~/Notes/inbox"];

const SCENARIOS = [
  { key:'firstRun',    label:'First run',       signedIn:true,  transcript:true,  phase:'idle',
    local:{selected:true,  state:'idle', folder:null}, cloud:{selected:false, state:'idle', remembered:false} },
  { key:'idle',        label:'Ready',           signedIn:true,  transcript:true,  phase:'idle',
    local:{selected:true,  state:'idle', folder:'Transcriptly'}, cloud:{selected:false, state:'idle', remembered:false} },
  { key:'capturing',   label:'Capturing',       signedIn:true,  transcript:true,  phase:'capturing',
    local:{selected:true,  state:'saving', folder:'Transcriptly'}, cloud:{selected:false, state:'idle', remembered:false} },
  { key:'localDone',   label:'Local saved',     signedIn:true,  transcript:true,  phase:'done',
    local:{selected:true,  state:'done', folder:'Transcriptly'}, cloud:{selected:false, state:'idle', remembered:false} },
  { key:'bothDone',    label:'Local + cloud',   signedIn:true,  transcript:true,  phase:'done',
    local:{selected:true,  state:'done', folder:'Transcriptly'}, cloud:{selected:true,  state:'done',  remembered:true} },
  { key:'cloudFailed', label:'Cloud failed',    signedIn:true,  transcript:true,  phase:'done',
    local:{selected:true,  state:'done', folder:'Transcriptly'}, cloud:{selected:true,  state:'error', remembered:true} },
  { key:'noTranscript',label:'No transcript',   signedIn:true,  transcript:false, phase:'error',
    local:{selected:true,  state:'idle', folder:'Transcriptly'}, cloud:{selected:false, state:'idle', remembered:false} },
  { key:'signedOut',   label:'Signed out',      signedIn:false, transcript:true,  phase:'idle',
    local:{selected:true,  state:'idle', folder:'Transcriptly'}, cloud:{selected:false, state:'idle', remembered:false} },
];

function ts(t) {
  const m = Math.floor(t / 60), s = t % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function propsHtml() {
  const rows = [
    ['Video', video.title], ['Channel', video.channel], ['URL', video.url],
    ['Language', video.language], ['Duration', video.duration], ['Captured', video.capturedAt],
  ];
  return `<details class="props">
    <summary><span class="chev">▸</span> Properties</summary>
    <div class="props-grid">${rows.map(([k,v]) => `<div class="prop"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
  </details>`;
}
function transcriptHtml() {
  return `<div class="section-label">Transcript · ${segments.length} segments</div>
    <p class="desc">${description}</p>
    ${segments.map(s => `<div class="seg"><span class="ts">${ts(s.t)}</span><span class="tx">${s.text}</span></div>`).join('')}`;
}
function skeletonHtml() {
  return `<div class="capturing-note"><span class="spinner"></span> Opening the Transcript panel and reading segments…</div>
    <div class="skeleton"><div class="line w80"></div><div class="line w60"></div><div class="line w45"></div><div class="line w80"></div><div class="line w60"></div></div>`;
}
function errcardHtml() {
  return `<div class="errcard"><b>No transcript found</b>YouTube didn't expose a transcript for this video. Open the Transcript panel on the page, then retry.</div>`;
}

const folderIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
function folderBtn(s) {
  const name = s.local.folder;
  return `<button class="folder ${name?'':'empty'}" data-action="folder">
    ${folderIcon}<span class="fname-label">${name || 'Choose folder…'}</span><span class="chev">▾</span>
  </button>
  <div class="folder-menu">
    ${FOLDERS.map(f => `<button class="opt" data-folder="${f}">${folderIcon} ${f}</button>`).join('')}
    <button class="opt pick" data-folder-pick>Choose another folder… <span style="color:var(--faint)">(showDirectoryPicker)</span></button>
  </div>`;
}

function toggle(name, checked, hint) {
  return `<label class="tgl"><input type="checkbox" ${checked?'checked':''} disabled><span class="track"></span>${name}${hint?`<span class="hint">${hint}</span>`:''}</label>`;
}

function render() {
  const s = SCENARIOS.find(x => x.key === scenarioKey);
  const savedLocal = s.local.state === 'done';
  const savedCloud = s.cloud.state === 'done';

  const fname = `<input class="fname ${savedLocal?'saved':''}" value="${video.file}" spellcheck="false" />`;
  const props = propsHtml();

  let content = '';
  if (!s.transcript) content = `<div class="content">${errcardHtml()}</div>`;
  else if (s.phase === 'capturing') content = `<div class="content">${skeletonHtml()}</div>`;
  else content = `<div class="content">${transcriptHtml()}</div>`;

  let banner = '';
  if (s.phase === 'done' && s.cloud.state === 'error') {
    banner = `<div class="banner ok">✓ Saved locally — ${s.local.folder}/${video.file}<span class="retry">Cloud failed — retry</span></div>`;
  } else if (s.phase === 'done' && s.cloud.state === 'done') {
    banner = `<div class="banner ok">✓ Saved to ${s.local.folder} · uploaded to private library</div>`;
  } else if (s.phase === 'done') {
    banner = `<div class="banner ok">✓ Saved to ${s.local.folder} — ${video.file}</div>`;
  }

  let cloudEl = '';
  if (!s.signedIn) {
    cloudEl = `<span class="signin">Sign in to save to cloud</span>`;
  } else {
    cloudEl = toggle('Cloud', s.cloud.selected || s.cloud.remembered, s.cloud.remembered ? 'remembered' : 'private');
  }
  let cloudErr = '';
  if (s.cloud.state === 'error') {
    cloudErr = `<div class="cloud-err">Cloud upload failed — local copy is safe · Retry</div>`;
  }

  const footer = `<div class="footer">
    <div class="dest-row">
      ${toggle('Local', s.local.selected, 'default')}
      <span class="spacer"></span>
      ${folderBtn(s)}
    </div>
    <div class="dest-row">
      ${cloudEl}
    </div>
    ${cloudErr}
    <button class="save" ${(s.phase === 'capturing' || !s.transcript) ? 'disabled' : ''}>${savedLocal ? '✓ Saved' : (s.phase === 'capturing' ? 'Capturing…' : 'Save')}</button>
  </div>`;

  document.getElementById('popup').innerHTML = fname + props + content + banner + footer;
  document.getElementById('dump').textContent =
    `scenario: ${s.key} — ${s.label}\n` +
    `transcript: ${s.transcript} · signedIn: ${s.signedIn} · phase: ${s.phase}\n` +
    `local: ${JSON.stringify(s.local)} · cloud: ${JSON.stringify(s.cloud)}`;
  renderBar();
}

function renderBar() {
  const bar = document.getElementById('scenarioBar');
  bar.innerHTML = `<span class="cap">capture state</span>` +
    SCENARIOS.map(sc =>
      `<button class="pill ${sc.key===scenarioKey?'active':''}" data-scenario="${sc.key}">${sc.label}</button>`
    ).join('');
}

const params = new URLSearchParams(location.search);
let scenarioKey = params.get('scenario') || 'firstRun';
if (!SCENARIOS.find(x => x.key === scenarioKey)) scenarioKey = 'firstRun';

// scenario switching
document.getElementById('scenarioBar').addEventListener('click', e => {
  const b = e.target.closest('[data-scenario]');
  if (!b) return;
  scenarioKey = b.dataset.scenario;
  const url = new URL(location);
  url.searchParams.set('scenario', scenarioKey);
  history.replaceState(null, '', url);
  render();
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const idx = parseInt(e.key, 10);
  if (idx >= 1 && idx <= SCENARIOS.length) {
    scenarioKey = SCENARIOS[idx - 1].key;
    const url = new URL(location);
    url.searchParams.set('scenario', scenarioKey);
    history.replaceState(null, '', url);
    render();
  }
});

// folder picker (prototype interaction)
document.getElementById('popup').addEventListener('click', e => {
  const btn = e.target.closest('[data-action="folder"]');
  if (btn) {
    const menu = btn.parentElement.querySelector('.folder-menu');
    menu.classList.toggle('open');
    return;
  }
  const opt = e.target.closest('[data-folder]');
  if (opt) {
    const s = SCENARIOS.find(x => x.key === scenarioKey);
    s.local.folder = opt.dataset.folder;
    render();
    return;
  }
  const pick = e.target.closest('[data-folder-pick]');
  if (pick) {
    const s = SCENARIOS.find(x => x.key === scenarioKey);
    s.local.folder = 'My New Folder'; // stand-in for showDirectoryPicker() result
    render();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('[data-action="folder"]')) {
    document.querySelectorAll('.folder-menu.open').forEach(m => m.classList.remove('open'));
  }
});

render();
</script>
</body>
</html>
