name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/liujiaqi222/transcriptly-app
  IMAGE_MIGRATE: ghcr.io/liujiaqi222/transcriptly-migrate

jobs:
  release-extension:
    name: build & release extension zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # job-level permissions replace the workflow-level set for this job;
    # creating releases needs contents:write, and this job pushes no images.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the full store-readiness checks (version, permissions,
      # entrypoints, dev addresses, manifest key -> extension ID, origin
      # allowlists) and builds + verifies the Chrome Web Store ZIP.
      - name: Build & verify extension ZIP
        run: pnpm release

      # Attach the ZIP to a per-version GitHub Release so the store-upload
      # artifact is downloadable without a local build. Same version pushed
      # again recreates the release (tag included) so the tag and source
      # archives always point at the newest commit, not the first one that
      # published that version.
      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          TAG="extension-v${VERSION}"
          ZIP=$(find apps/extension/.output -maxdepth 1 -name '*.zip' -print -quit)
          echo "releasing ${ZIP} as ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi
          gh release create "${TAG}" \
            --title "Extension ${VERSION}" \
            --notes "Chrome Web Store package for extension v${VERSION}, built from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}" \
            "${ZIP}"

  build-and-deploy:
    name: build & deploy to Tokyo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # next build evaluates the auth module at build time, so these env vars
      # must be present. DATABASE_URL is only validated (never connected), so a
      # placeholder is enough; real secrets come from GitHub secrets.
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:latest
            ${{ env.IMAGE_APP }}:${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://transcriptly:build@postgres:5432/transcriptly
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=https://transcript.libmap.cn
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            EXTENSION_ORIGINS=chrome-extension://jkopejjjgdkkacabdhgdlploehikphai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATE }}:latest
            ${{ env.IMAGE_MIGRATE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Tokyo
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.TOKYO_SSH_HOST }}
          username: ${{ secrets.TOKYO_SSH_USER }}
          key: ${{ secrets.TOKYO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,GITHUB_SHA
          script: |
            curl -fsSL "https://raw.githubusercontent.com/liujiaqi222/transcriptly/${GITHUB_SHA}/compose.yaml" -o ~/transcriptly/compose.yaml
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/transcriptly
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
