services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcriptly}
      POSTGRES_USER: ${POSTGRES_USER:-transcriptly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcriptly}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcriptly}:${POSTGRES_PASSWORD:-transcriptly}@postgres:5432/${POSTGRES_DB:-transcriptly}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcriptly}:${POSTGRES_PASSWORD:-transcriptly}@postgres:5432/${POSTGRES_DB:-transcriptly}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
