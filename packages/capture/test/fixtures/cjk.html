<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="title" content="从零开始学分布式系统" />
    <meta name="description" content="一个半小时讲清楚一致性与共识。" />
    <meta itemprop="duration" content="PT12M8S" />
    <meta itemprop="datePublished" content="2024-11-20" />
    <meta itemprop="inLanguage" content="zh" />
    <link itemprop="name" content="架构夜谈" />
    <link itemprop="url" href="https://www.youtube.com/@architecture-night" />
  </head>
  <body>
    <ytd-video-description-transcript-section-renderer>
      <div id="title">
        <h3>Transcript</h3>
      </div>
    </ytd-video-description-transcript-section-renderer>

    <ytd-transcript-renderer>
      <div id="segments-container">
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:00</div>
          <yt-formatted-string class="segment-text"
            >大家好，今天我们来聊分布式系统</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:04</div>
          <yt-formatted-string class="segment-text"
            >首先，什么是一致性？</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:12</div>
          <yt-formatted-string class="segment-text"
            >一致性意味着所有节点看到相同的数据</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:58</div>
          <yt-formatted-string class="segment-text"
            >接下来我们讨论共识算法</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">1:41</div>
          <yt-formatted-string class="segment-text"
            >Paxos 与 Raft 是最常见的两种</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">2:33</div>
          <yt-formatted-string class="segment-text"
            >Raft 更容易理解，所以我们用它举例</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">3:27</div>
          <yt-formatted-string class="segment-text"
            >选举、日志复制、安全性，这三件事</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">4:10</div>
          <yt-formatted-string class="segment-text"
            >最后我们看看实际系统中的坑</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
      </div>
    </ytd-transcript-renderer>
  </body>
</html>
