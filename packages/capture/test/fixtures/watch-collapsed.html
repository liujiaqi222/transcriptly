<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="title" content="A Practical Guide to Agents" />
    <meta
      name="description"
      content="Engineering lessons behind production agent systems."
    />
    <meta itemprop="duration" content="PT1H2M4S" />
    <meta itemprop="datePublished" content="2024-08-01" />
    <meta itemprop="inLanguage" content="en" />
    <link itemprop="name" content="Ship It Weekly" />
    <link itemprop="url" href="https://www.youtube.com/@shipitweekly" />
  </head>
  <body>
    <ytd-video-description-transcript-section-renderer>
      <div id="title">
        <h3>Transcript</h3>
      </div>
      <div id="content">
        <ytd-button-renderer>
          <button aria-label="Show transcript">Show transcript</button>
        </ytd-button-renderer>
      </div>
    </ytd-video-description-transcript-section-renderer>

    <ytd-transcript-renderer>
      <div id="segments-container"></div>
    </ytd-transcript-renderer>

    <template id="transcript-segments">
      <ytd-transcript-segment-renderer>
        <div class="segment-timestamp">0:00</div>
        <yt-formatted-string class="segment-text"
          >so you've been building agents</yt-formatted-string
        >
      </ytd-transcript-segment-renderer>
      <ytd-transcript-segment-renderer>
        <div class="segment-timestamp">0:05</div>
        <yt-formatted-string class="segment-text"
          >and you keep hitting the same walls</yt-formatted-string
        >
      </ytd-transcript-segment-renderer>
      <ytd-transcript-segment-renderer>
        <div class="segment-timestamp">1:01</div>
        <yt-formatted-string class="segment-text"
          >so let's fix the core loop first</yt-formatted-string
        >
      </ytd-transcript-segment-renderer>
      <ytd-transcript-segment-renderer>
        <div class="segment-timestamp">1:02:04</div>
        <yt-formatted-string class="segment-text"
          >that's all for today, thanks for watching</yt-formatted-string
        >
      </ytd-transcript-segment-renderer>
    </template>
  </body>
</html>
