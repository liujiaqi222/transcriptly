<!doctype html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="title" content="English video with Chinese transcript" />
    <meta name="description" content="The transcript is rendered in the in-video panel." />
    <link itemprop="name" content="Caption Channel" />
    <link itemprop="url" href="https://www.youtube.com/@captionchannel" />
  </head>
  <body>
    <ytd-engagement-panel-section-list-renderer
      visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED"
    >
      <div id="contents">
        <macro-markers-panel-item-view-model>
          <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
            <div class="ytwTranscriptSegmentViewModelTimestamp">0:00</div>
            <span role="text">大家好，我是肖恩 最近，记忆在AI智能体系统中非常流行</span>
          </transcript-segment-view-model>
        </macro-markers-panel-item-view-model>
        <macro-markers-panel-item-view-model>
          <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
            <div class="ytwTranscriptSegmentViewModelTimestamp">0:06</div>
            <span role="text">任何LLM调用都不会长期携带任何记忆权重</span>
          </transcript-segment-view-model>
        </macro-markers-panel-item-view-model>
      </div>
      <div id="contents">
        <macro-markers-panel-item-view-model>
          <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
            <div class="ytwTranscriptSegmentViewModelTimestamp">0:12</div>
            <span role="text">后续章节也必须被保存</span>
          </transcript-segment-view-model>
        </macro-markers-panel-item-view-model>
      </div>
    </ytd-engagement-panel-section-list-renderer>
  </body>
</html>
