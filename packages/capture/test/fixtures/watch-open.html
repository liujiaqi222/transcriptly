<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="title" content="Rust for TypeScript Developers" />
    <meta name="description" content="Borrow checker without the tears." />
    <meta itemprop="duration" content="PT23M11S" />
    <meta itemprop="datePublished" content="2025-01-15" />
    <meta itemprop="inLanguage" content="en" />
    <link itemprop="name" content="Crab People" />
    <link itemprop="url" href="https://www.youtube.com/@crabpeople" />
  </head>
  <body>
    <ytd-video-description-transcript-section-renderer>
      <div id="title">
        <h3>Transcript</h3>
      </div>
    </ytd-video-description-transcript-section-renderer>

    <ytd-engagement-panel-section-list-renderer
      visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED"
      target-id="engagement-panel-searchable-transcript"
    >
      <div id="contents">
        <ytd-transcript-renderer>
          <div id="segments-container">
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:00</div>
          <yt-formatted-string class="segment-text"
            >ownership is just a borrow checker</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:09</div>
          <yt-formatted-string class="segment-text"
            >not a garbage collector</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:42</div>
          <yt-formatted-string class="segment-text"
            >so you can stop fighting the compiler</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
          </div>
        </ytd-transcript-renderer>
      </div>
    </ytd-engagement-panel-section-list-renderer>
  </body>
</html>
