          <div class="segment-timestamp">0:00</div>
          <yt-formatted-string class="segment-text"

        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:06</div>
          <yt-formatted-string class="segment-text"
            >today we ship a feature end to end</yt-formatted-string
          >

        <ytd-transcript-section-header-renderer>
          <yt-formatted-string>Spec &amp; Scope</yt-formatted-string>
        </ytd-transcript-section-header-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:11</div>
          <yt-formatted-string class="segment-text"
            >every feature starts with a spec</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:29</div>
          <yt-formatted-string class="segment-text"
            >keep the first slice tiny</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-section-header-renderer>
          <yt-formatted-string>Ship It</yt-formatted-string>
        </ytd-transcript-section-header-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:52</div>
          <yt-formatted-string class="segment-text"
            >then open the pull request</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">1:05</div>
          <yt-formatted-string class="segment-text"
            >that's the whole loop</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
      </div>
    </ytd-transcript-renderer>
