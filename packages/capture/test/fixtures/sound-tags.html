<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="title" content="Tagged Transcript Video" />
    <meta name="description" content="Auto captions with sound-event tags." />
    <meta itemprop="duration" content="PT1M" />
    <meta itemprop="inLanguage" content="en" />
    <link itemprop="name" content="Tagged Channel" />
    <link itemprop="url" href="https://www.youtube.com/@taggedchannel" />
  </head>
  <body>
    <ytd-video-description-transcript-section-renderer>
      <div id="title">
        <h3>Transcript</h3>
      </div>
    </ytd-video-description-transcript-section-renderer>

    <ytd-transcript-renderer>
      <div id="segments-container">
        <ytd-transcript-section-header-renderer>
          <yt-formatted-string>Intro</yt-formatted-string>
        </ytd-transcript-section-header-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:00</div>
          <yt-formatted-string class="segment-text"
            >welcome back to the show</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:05</div>
          <yt-formatted-string class="segment-text">[Music]</yt-formatted-string>
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:09</div>
          <yt-formatted-string class="segment-text"
            >[Applause] thanks for having me</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-section-header-renderer>
          <yt-formatted-string>Deep dive</yt-formatted-string>
        </ytd-transcript-section-header-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:12</div>
          <yt-formatted-string class="segment-text">[音乐]</yt-formatted-string>
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:15</div>
          <yt-formatted-string class="segment-text"
            >let's [Music] dig in</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:18</div>
          <yt-formatted-string class="segment-text"
            >indexes like [1] stay too</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-section-header-renderer>
          <yt-formatted-string>Outro</yt-formatted-string>
        </ytd-transcript-section-header-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:21</div>
          <yt-formatted-string class="segment-text"
            >♪ ♪</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
      </div>
    </ytd-transcript-renderer>
  </body>
</html>
